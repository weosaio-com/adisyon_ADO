packages:
  - 'apps/*'
  - 'packages/*'
  - 'plugins/*'
# Prisma'nin engine indiren postinstall scriptine izin ver (guvenlik allowlist).
allowBuilds:
  '@nestjs/core': true
  electron: true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  electron-winstaller: false
  # Cloudflare yerel calisma zamani (bulut testleri/wrangler dev): platform ikilisini dogrular.
  workerd: true
