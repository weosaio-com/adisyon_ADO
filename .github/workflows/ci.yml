name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Ayni PR'a arka arkaya push gelirse eski calismayi iptal et.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0' # CI'da git hook kurulumu gereksiz
      DATABASE_URL: 'file:./dev.db' # prisma generate/validate icin (gercek DB kullanilmaz)
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate + validate (cok-dosyali sema)
        run: |
          pnpm prisma:generate
          pnpm prisma:validate

      - name: Build shared (@ado/shared dist -> backend bagimliligi)
        run: pnpm --filter @ado/shared build

      - name: Format check (prettier)
        run: pnpm format:check

      - name: Lint (eslint)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Tum paketlerin self-check'leri (backend + frontend + desktop).
      - name: Unit tests (self-check)
        run: pnpm test

  # Kritik para yollari e2e: sunucu + seed + smoke (merge/split/iade/idempotency).
  e2e:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
      DATABASE_URL: 'file:./e2e.db'
      JWT_ACCESS_SECRET: 'ci-test-access-secret-0123456789'
      JWT_REFRESH_SECRET: 'ci-test-refresh-secret-0123456789'
      SEED_OWNER_USERNAME: 'owner'
      SEED_OWNER_PASSWORD: 'owner1234'
      API_PORT: '3001'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Build shared (@ado/shared dist -> backend bagimliligi)
        run: pnpm --filter @ado/shared build

      - name: Migrate + seed (temiz e2e DB)
        run: |
          pnpm exec prisma migrate deploy
          pnpm --filter @ado/backend run seed

      - name: Sunucu + e2e smoke
        run: |
          pnpm --filter @ado/backend run dev &
          for i in $(seq 1 60); do
            curl -sf "http://127.0.0.1:${API_PORT}/api/v1/health" >/dev/null && break
            sleep 1
          done
          pnpm --filter @ado/backend run test:e2e

  # Tarayici seviyesi offline E2E: gercek PWA (IndexedDB outbox + SW + reconnect drain).
  e2e-web:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
      DATABASE_URL: 'file:./e2e-web.db'
      JWT_ACCESS_SECRET: 'ci-test-access-secret-0123456789'
      JWT_REFRESH_SECRET: 'ci-test-refresh-secret-0123456789'
      SEED_OWNER_USERNAME: 'owner'
      SEED_OWNER_PASSWORD: 'owner1234'
      API_PORT: '3001'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Build shared (@ado/shared dist -> backend bagimliligi)
        run: pnpm --filter @ado/shared build

      - name: Build frontend (backend dist'i sunar)
        run: pnpm --filter @ado/frontend build

      - name: Migrate + seed (temiz e2e DB)
        run: |
          pnpm exec prisma migrate deploy
          pnpm --filter @ado/backend run seed

      - name: Playwright tarayici (chromium)
        run: pnpm --filter @ado/frontend exec playwright install --with-deps chromium

      - name: Sunucu + offline E2E
        run: |
          pnpm --filter @ado/backend run dev &
          for i in $(seq 1 60); do
            curl -sf "http://127.0.0.1:${API_PORT}/api/v1/health" >/dev/null && break
            sleep 1
          done
          pnpm --filter @ado/frontend run test:e2e

      - name: Playwright raporu (hata halinde)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7
